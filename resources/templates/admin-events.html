<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" th:replace="~{layout :: main-layout(~{::section})}">
<body>
<section>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2>Управление мероприятиями</h2>
        <a th:href="@{/admin/events/new}" class="btn-reg" style="background: #27ae60;">+ Создать страницу</a>
    </div>

    <table style="width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
        <thead style="background: #2c3e50; color: white;">
        <tr>
            <th style="padding: 15px; text-align: left;">Название</th>
            <th style="padding: 15px; text-align: left;">Категория</th>
            <th style="padding: 15px; text-align: left;">Дата</th>
            <th style="padding: 15px; text-align: center;">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}" style="border-bottom: 1px solid #eee;">
            <td style="padding: 15px; font-weight: bold;" th:text="${event.name}">Name</td>
            <td style="padding: 15px;" th:text="${event.category}">Category</td>
            <td style="padding: 15px;" th:text="${#temporals.format(event.date, 'dd.MM.yyyy HH:mm')}">Date</td>
            <td style="padding: 15px; text-align: center;">
                <a th:href="@{/admin/events/edit/{id}(id=${event.eventId})}" style="text-decoration: none; margin-right: 15px;">✏️</a>
                <form th:action="@{/admin/events/delete/{id}(id=${event.eventId})}" method="post" style="display: inline;"
                      onsubmit="return confirm('Удалить эту страницу навсегда?');">
                    <button type="submit" style="background: none; border: none; cursor: pointer;">🗑️</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
