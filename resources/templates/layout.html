<!DOCTYPE html>
<html th:fragment="main-layout(content)" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Билетный сервис</title>
    <th:block th:replace="~{fragments :: header-css}"></th:block>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0; font-family: sans-serif;">


<div th:replace="~{fragments :: header}"></div>

<main style="flex: 1; padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%;">

    <div th:replace="${content}"></div>
</main>

<div th:replace="~{fragments :: footer}"></div>

</body>
</html>
